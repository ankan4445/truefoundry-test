type: service
name: coffee-shop
allow_interception: false
image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/ankan4445/truefoundry-test.git
    branch_name: main
    # Pinned commit to deploy — required by TrueFoundry (GitSource.ref).
    # Update before every `tfy deploy`: run `git rev-parse HEAD` on the
    # commit you want live and paste it in here.
    ref: b12b67f4d8119fc05e60e848f5b81fda67566871
  build_spec:
    type: tfy-python-buildpack
    # Only this subfolder of the repo is sent as the build context — this
    # is the mechanism that lets multiple app folders share one repo root.
    build_context_path: ./coffee-shop-react-with-agents.md
    # tfy-python-buildpack has no Node auto-detection; apt-install a Node
    # toolchain into the build image so `command` below can run npm.
    apt_packages:
      - nodejs
      - npm
    # Runs as the container's entrypoint (i.e. at container start, not at
    # image-build time) — see the design doc's "confirmed schema" section
    # for why, and the tradeoffs of this Python-buildpack-for-Node hack.
    command:
      - sh
      - -c
      - npm install && npm run build && npm run start
env:
  # Must exactly match ports[0].path below — vite.config.ts uses this as
  # the production `base`, so asset URLs baked into index.html match what
  # the browser actually requests. The ingress's default rewrite_path_to
  # ("/") only changes the request the *container* sees internally; it does
  # NOT change what path the browser must use to reach this service at all,
  # so `base` still has to carry the real external prefix. (Confirmed by a
  # live deploy 404-ing on /assets/... when base was left as "/".)
  TFY_BASE_PATH: /coffee-shop/
  PORT: "8080"
ports:
  - app_protocol: http
    expose: true
    host: tfy-test-usw2-ee.my.automationanywhere.digital
    path: /coffee-shop/
    port: 8080
    protocol: TCP
replicas: 1
resources:
  cpu_limit: 0.5
  cpu_request: 0.2
  ephemeral_storage_limit: 2000
  ephemeral_storage_request: 1000
  memory_limit: 500
  memory_request: 200
  node:
    type: node_selector
    capacity_type: spot_fallback_on_demand
workspace_fqn: tfy-aws-test-usw2-ee:community-and-learning-dev-ws
